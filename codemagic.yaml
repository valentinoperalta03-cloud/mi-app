workflows:
  ios-distribution:
    name: iOS Distribution
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Add iOS platform
        script: |
          mkdir -p capacitor-dist
          echo '<html><body></body></html>' > capacitor-dist/index.html
          npm install @capacitor/core @capacitor/ios @capacitor/cli
          rm -rf ios
          ./node_modules/.bin/cap add ios
          ./node_modules/.bin/cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
          keychain add-certificates --certificate /tmp/certificate.p12 --certificate-password $CM_CERTIFICATE_PASSWORD
          echo $CM_PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build iOS
        script: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive
      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ios/App/ExportOptions.plist \
            -exportPath build/
    artifacts:
      - build/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false

workflows:
  ios-distribution:
    name: iOS Distribution
    instance_type: mac_mini_m2
    environment:
      groups:
        - ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.padelibre.app
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Capacitor sync
        script: |
          test -f capacitor-dist/index.html || { echo "Missing capacitor-dist/index.html"; exit 1; }
          npx cap sync ios
      - name: Add OneSignal SPM dependency
        script: node scripts/add-onesignal-spm.mjs
      - name: Resolve SPM dependencies
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath ~/Library/Developer/Xcode/DerivedData/SourcePackages
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          VERSION_STRING=$(grep -m1 'MARKETING_VERSION =' App.xcodeproj/project.pbxproj | sed 's/.*= //;s/;//;s/ //g')
          echo "Marketing version (CFBundleShortVersionString): $VERSION_STRING"

          LATEST_ASC=$(app-store-connect get-latest-app-store-build-number "$APP_APPLE_ID" --version-string "$VERSION_STRING" || true)
          LATEST_TF=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" --version-string "$VERSION_STRING" || true)
          LATEST_ASC=${LATEST_ASC:-0}
          LATEST_TF=${LATEST_TF:-0}
          LATEST_BUILD_NUMBER=$LATEST_ASC
          if [ "$LATEST_TF" -gt "$LATEST_BUILD_NUMBER" ]; then
            LATEST_BUILD_NUMBER=$LATEST_TF
          fi

          NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          # Evita colisión si App Store Connect aún no refleja un upload reciente
          if [ -n "${CM_BUILD_NUMBER:-}" ] && [ "$NEW_BUILD_NUMBER" -le "$CM_BUILD_NUMBER" ]; then
            NEW_BUILD_NUMBER=$((CM_BUILD_NUMBER + 1))
          fi

          agvtool new-version -all "$NEW_BUILD_NUMBER"
          echo "iOS build number (CFBundleVersion) for $VERSION_STRING: $NEW_BUILD_NUMBER"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false

  android-production:
    name: Android Production
    max_build_duration: 120
    instance_type: linux
    environment:
      groups:
        - android
      vars:
        PACKAGE_NAME: com.padelibre.app
        CM_KEYSTORE_PATH: /tmp/upload-keystore.jks
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build Next.js
        script: npm run build
      - name: Prepare Capacitor web directory
        script: npm run capacitor:prepare
      - name: Capacitor sync
        script: npx cap sync android
      - name: Set up Android keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_KEYSTORE_PATH
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Android release
        script: |
          set -e
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" || true)
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=${LATEST_GOOGLE_PLAY_BUILD_NUMBER:-0}
          UPDATED_BUILD_NUMBER=$((LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
          if [ -n "${CM_BUILD_NUMBER:-}" ] && [ "$UPDATED_BUILD_NUMBER" -le "$CM_BUILD_NUMBER" ]; then
            UPDATED_BUILD_NUMBER=$((CM_BUILD_NUMBER + 1))
          fi
          echo "Android versionCode: $UPDATED_BUILD_NUMBER"
          cd android
          ./gradlew bundleRelease \
            -PversionCode=$UPDATED_BUILD_NUMBER \
            -PversionName=1.0.0
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        # Primera vez: usar internal + draft. Luego podés cambiar a production en Play Console.
        track: internal
        submit_as_draft: true
        changes_not_sent_for_review: true

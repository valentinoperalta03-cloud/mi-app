# Despliega SIEMPRE al proyecto correcto (mi-app-ksox → www.padelibre.online),
# sin depender del webhook Git↔Vercel (suele fallar si hay dos proyectos "mi-app").
#
# Configuración única en GitHub del repo:
#   Settings → Secrets and variables → Actions → New repository secret
#     Name:  VERCEL_TOKEN
#     Value: token clásico desde https://vercel.com/account/tokens
#   (OAuth del CLI no puede crear tokens; hay que crearlo en el panel.)
#
# Opcional: en Vercel → mi-app-ksox → Settings → Git, desactivá "Automatic deployments"
# si no querés doble build (Git + esta Action).

name: Deploy production (mi-app-ksox)

on:
  push:
    branches:
      - main
      - auth-callback-error
  workflow_dispatch:

concurrency:
  group: vercel-mi-app-ksox-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_i3LJIr6tiyGAXBn2QwYImtCE
  VERCEL_PROJECT_ID: prj_00odwWfVmNBc9fq4l4dAZ9QpL2qn

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'valentinoperalta03-cloud/mi-app' && github.event.repository.fork == false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env (production)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build (Vercel)
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

# Despliega a mi-app-ksox (www.padelibre.online) sin depender del webhook Git↔Vercel.
#
# Secret obligatorio: VERCEL_TOKEN (token clásico en https://vercel.com/account/tokens)

name: Deploy production (mi-app-ksox)

on:
  push:
    branches:
      - main
      - auth-callback-error
  workflow_dispatch:

concurrency:
  group: vercel-mi-app-ksox-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_i3LJIr6tiyGAXBn2QwYImtCE
  VERCEL_PROJECT_ID: prj_00odwWfVmNBc9fq4l4dAZ9QpL2qn

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'valentinoperalta03-cloud/mi-app' && github.event.repository.fork == false
    steps:
      # fetch-depth: 0 evita problemas cuando la CLI de Vercel usa metadata git
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deploy to Vercel (remote build)
        run: npx vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

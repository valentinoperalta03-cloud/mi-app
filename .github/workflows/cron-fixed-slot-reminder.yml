# Vercel Hobby solo permite crons diarios; el recordatorio de turnos fijos debe ser horario.
# Misma ruta que antes en vercel.json — requiere el secret CRON_SECRET (igual que en Vercel).

name: Cron fixed-slot reminder (hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: github.repository == 'valentinoperalta03-cloud/mi-app' && github.event.repository.fork == false
    steps:
      - name: Call production cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_URL: ${{ vars.CRON_FIXED_SLOT_REMINDER_URL }}
        run: |
          set -e
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository secret CRON_SECRET"
            exit 1
          fi
          URL="${CRON_URL:-https://www.padelibre.online/api/cron/fixed-slot-reminder}"
          curl -fsS -X GET "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}"

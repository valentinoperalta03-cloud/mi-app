# Compila y publica el AAB de Android en Google Play.
#
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#          ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
# Opcional (build Next.js): NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY

name: Android release (Google Play)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-google-play-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.padelibre.app
  VERSION_NAME: "1.0.0"
  CM_KEYSTORE_PATH: /tmp/upload-keystore.jks

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.repository.fork == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.padelibre.online
        run: npm run build

      - name: Write Capacitor shell (redirect to login, no empty HTML)
        run: npm run capacitor:prepare

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CM_KEYSTORE_PATH"

      - name: Build signed AAB
        env:
          CI: true
          CM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_CODE="$(( ${{ github.run_number }} + 1000 ))"
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Validate Google Play service account JSON
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys
          raw = os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"].strip()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not valid JSON: {e}")
              sys.exit(1)
          for key in ("type", "project_id", "private_key", "client_email"):
              if key not in data:
                  print(f"::error::Missing field in service account JSON: {key}")
                  sys.exit(1)
          print(f"Service account OK: {data['client_email']}")
          PY

      - name: Upload AAB to Google Play (internal testing)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.padelibre.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

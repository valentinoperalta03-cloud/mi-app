# Compila y publica el AAB de Android en Google Play (track production).
#
# Secrets requeridos: ver comentario al final del archivo o la documentación del repo.

name: Android release (Google Play)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-google-play-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.padelibre.app
  VERSION_NAME: "1.0.0"
  CM_KEYSTORE_PATH: /tmp/upload-keystore.jks

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.repository.fork == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Capacitor sync (Android)
        run: |
          mkdir -p capacitor-dist
          echo '<html><body></body></html>' > capacitor-dist/index.html
          npx cap sync android

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CM_KEYSTORE_PATH"

      - name: Build signed AAB
        env:
          CI: true
          CM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_CODE="${{ github.run_number }}"
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Upload AAB to Google Play (production)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.padelibre.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: production
          status: completed

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

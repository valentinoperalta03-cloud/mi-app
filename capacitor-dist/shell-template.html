<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0085FC" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PadeLibre</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 0px) 1.5rem env(safe-area-inset-bottom, 0px);
      background: #0085fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.75rem;
      pointer-events: none;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      object-fit: cover;
      pointer-events: none;
    }

    .spinner {
      width: 2rem;
      height: 2rem;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      pointer-events: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .offline {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      max-width: 18rem;
      text-align: center;
      pointer-events: auto;
    }

    .offline.visible {
      display: flex;
    }

    .offline p {
      margin: 0;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 600;
      line-height: 1.45;
      pointer-events: none;
    }

    .retry-btn {
      border: none;
      border-radius: 1rem;
      padding: 0.875rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #0085fc;
      background: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .retry-btn:active {
      transform: scale(0.98);
      opacity: 0.92;
    }

    .splash.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div id="splash" class="splash">
    <img src="logo.png" alt="" class="logo" width="80" height="80" draggable="false" />
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <div id="offline" class="offline" role="alert">
    <p>Sin conexión. Verificá tu internet e intentá de nuevo.</p>
    <button type="button" class="retry-btn" id="retry-btn">Reintentar</button>
  </div>

  <script>
    (function () {
      var LOGIN_URL = "https://www.padelibre.online/login";
      var splash = document.getElementById("splash");
      var offline = document.getElementById("offline");
      var retryBtn = document.getElementById("retry-btn");

      function showOffline() {
        splash.classList.add("hidden");
        offline.classList.add("visible");
      }

      function showSplash() {
        splash.classList.remove("hidden");
        offline.classList.remove("visible");
      }

      function tryLoad() {
        showSplash();
        // navigator.onLine es suficiente para detectar si hay red.
        // El fetch previo causaba falsos negativos en Android (CORS del WebView).
        if (!navigator.onLine) {
          showOffline();
          return;
        }
        window.location.replace(LOGIN_URL);
      }

      retryBtn.addEventListener("click", tryLoad);

      window.addEventListener("online", function () {
        if (offline.classList.contains("visible")) {
          tryLoad();
        }
      });

      tryLoad();
    })();
  </script>
</body>
</html>
